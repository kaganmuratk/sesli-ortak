<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Sesli Ortak</title>
<style>
  :root {
    --bg: #0b0c10;
    --dim: #4a4f5c;
    --idle: #3a6df0;
    --awake: #f0a63a;
    --busy: #9a5cf0;
    --text: #d7d9e0;
    --text-dim: #6b7080;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(ellipse at center, #14161c 0%, var(--bg) 70%);
    color: var(--text);
    font-family: -apple-system, system-ui, "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
  }
  h1 {
    font-size: 0.95rem;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin: 0;
  }
  #orb-wrap {
    position: relative;
    width: 220px;
    height: 220px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 2px solid var(--dim);
    opacity: 0.5;
    transition: border-color 0.4s ease;
    pointer-events: none;
  }
  #ring.dinliyor {
    border-color: var(--idle);
    animation: nefes 3s ease-in-out infinite;
  }
  #ring.konusuyor {
    border-color: var(--awake);
    animation: nabiz 0.9s ease-in-out infinite;
  }
  #ring.isleniyor {
    border-color: var(--busy);
    border-style: dashed;
    animation: don 1.1s linear infinite;
  }
  #orb {
    width: 150px;
    height: 150px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #55596a, #23252d 70%);
    cursor: pointer;
    border: none;
    box-shadow: 0 0 0 rgba(58, 109, 240, 0);
    transition: box-shadow 0.5s ease, background 0.5s ease;
    color: var(--text-dim);
    font-size: 0.85rem;
    font-weight: 500;
  }
  #orb.dinliyor {
    background: radial-gradient(circle at 35% 30%, #4d78f2, #1c2c57 70%);
    box-shadow: 0 0 40px rgba(58, 109, 240, 0.35);
  }
  #orb.konusuyor {
    background: radial-gradient(circle at 35% 30%, #f5b158, #6b4413 70%);
    box-shadow: 0 0 55px rgba(240, 166, 58, 0.55);
    animation: buyu 0.9s ease-in-out infinite;
  }
  #orb.isleniyor {
    background: radial-gradient(circle at 35% 30%, #a970f5, #3d1c6b 70%);
    box-shadow: 0 0 45px rgba(154, 92, 240, 0.5);
  }
  @keyframes nefes {
    0%, 100% { transform: scale(1); opacity: 0.5; }
    50% { transform: scale(1.06); opacity: 0.85; }
  }
  @keyframes nabiz {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.1); }
  }
  @keyframes buyu {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
  }
  @keyframes don {
    100% { transform: rotate(360deg); }
  }
  #asama {
    font-size: 0.9rem;
    color: var(--text-dim);
    min-height: 1.2em;
  }
  #ipucu {
    font-size: 0.78rem;
    color: var(--text-dim);
    opacity: 0.6;
    max-width: 280px;
    text-align: center;
  }
  #sesli-satir {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 0.85rem;
    color: var(--text-dim);
  }
  #sesli-anahtar {
    width: 42px;
    height: 24px;
    border-radius: 12px;
    background: var(--dim);
    border: none;
    cursor: pointer;
    position: relative;
    transition: background 0.3s ease;
  }
  #sesli-anahtar::after {
    content: "";
    position: absolute;
    top: 3px;
    left: 3px;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: #d7d9e0;
    transition: transform 0.3s ease;
  }
  #sesli-anahtar.acik {
    background: var(--awake);
  }
  #sesli-anahtar.acik::after {
    transform: translateX(18px);
  }
  #kes {
    background: transparent;
    border: 1px solid var(--dim);
    color: var(--text-dim);
    border-radius: 8px;
    padding: 6px 16px;
    font-size: 0.8rem;
    cursor: pointer;
    transition: border-color 0.2s ease, color 0.2s ease;
  }
  #kes:hover {
    border-color: var(--awake);
    color: var(--awake);
  }
  #bitir {
    background: var(--awake);
    border: none;
    color: #1a1200;
    border-radius: 8px;
    padding: 8px 20px;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    display: none;
  }
  #bitir:hover {
    filter: brightness(1.1);
  }
</style>
</head>
<body>
  <h1>Sesli Ortak</h1>
  <div id="orb-wrap">
    <div id="ring"></div>
    <button id="orb">Başlat</button>
  </div>
  <div id="asama">kapalı</div>
  <div id="ipucu">Açıkken direkt konuş, otomatik algılar. Konuşmayı bitirince kendiliğinden gönderir.</div>
  <button id="bitir">Bitirdim, gönder</button>
  <div id="sesli-satir">
    <span>Sesli cevap</span>
    <button id="sesli-anahtar"></button>
  </div>
  <button id="kes">Kes</button>

<script>
const orb = document.getElementById("orb");
const ring = document.getElementById("ring");
const asamaEl = document.getElementById("asama");
const sesliAnahtar = document.getElementById("sesli-anahtar");
const bitirBtn = document.getElementById("bitir");

function uygula(sinif) {
  orb.className = sinif;
  ring.className = sinif;
}

async function durumGuncelle() {
  try {
    const r = await fetch("/durum");
    const d = await r.json();
    if (!d.aktif) {
      uygula("");
      orb.textContent = "Başlat";
      asamaEl.textContent = "kapalı";
    } else {
      orb.textContent = "Durdur";
      if (d.isleniyor) {
        uygula("isleniyor");
        asamaEl.textContent = "işleniyor... (kapatma, bitmesini bekler)";
      } else if (d.konusuyor) {
        uygula("konusuyor");
        asamaEl.textContent = "seni dinliyor...";
      } else {
        uygula("dinliyor");
        asamaEl.textContent = "açık, dinliyor";
      }
    }
    // "Bitirdim, gönder" sadece aktif kayit sirasinda anlamli - sessizlik
    // algisi gurultu yuzunden tetiklenmezse elle bitirmek icin (buyuk daireye
    // basmak sureci tamamen kapatir, kaydi kaybeder - bu onun yerine gecmez).
    bitirBtn.style.display = d.konusuyor ? "block" : "none";
    sesliAnahtar.className = d.sesli_acik ? "acik" : "";
  } catch (e) {}
}

orb.addEventListener("click", async () => {
  await fetch("/degistir", { method: "POST" });
  durumGuncelle();
});

sesliAnahtar.addEventListener("click", async () => {
  await fetch("/sesli_degistir", { method: "POST" });
  durumGuncelle();
});

document.getElementById("kes").addEventListener("click", () => {
  fetch("/kes", { method: "POST" });
});

bitirBtn.addEventListener("click", async () => {
  await fetch("/bitir", { method: "POST" });
  durumGuncelle();
});

setInterval(durumGuncelle, 700);
durumGuncelle();
</script>
</body>
</html>
